<body>

            <button id="sortearBtn">SORTEAR</button>

            <section id="resultado" class="resultado" aria-live="polite">

                    <span>SEU<br>ACOMPANHAMENTO<br>APARECERÁ AQUI</span>
                </div>

            </section>

            <img
                class="prato"
                src="images/prato.png"

        </section>
    </main>

            { nome: "VOLKSWAGEN GOL", busca: "Volkswagen Gol Brasil" },

            { nome: "CALÇADA DE COPACABANA", busca: "calcada Copacabana Rio de Janeiro" },
            { nome: "CANGA", busca: "canga praia Brasil" },
            { nome: "CHINELO DE DEDO", busca: "chinelo de dedo Brasil" },
            { nome: "CADEIRA DE PRAIA", busca: "cadeira de praia Brasil" },
            { nome: "GARRAFA TÉRMICA", busca: "garrafa termica Brasil" },
            { nome: "FITA DO SENHOR DO BONFIM", busca: "fita Senhor do Bonfim" },
            { nome: "MATE DE PRAIA", busca: "mate praia Rio de Janeiro" },
            { nome: "CAIXA DE ISOPOR", busca: "caixa de isopor praia Brasil" }
        ];

        const botao = document.getElementById("sortearBtn");
        const listaMenu = document.getElementById("listaMenu");
        const resultado = document.getElementById("resultado");
        const resultadoFoto = document.querySelector(".resultado-foto");
        const resultadoNome = document.querySelector(".resultado-nome");

        let sorteados = [];

        // Monta o menu com todos os itens em cinza.
        function montarMenu() {
            listaMenu.innerHTML = "";

            acompanhamentos.forEach((item, index) => {
                const linha = document.createElement("div");
                linha.className = "item-menu";
                linha.dataset.index = index;
                linha.textContent = item.nome;
                listaMenu.appendChild(linha);
            });
        }

        function atualizarMenu() {
            document.querySelectorAll(".item-menu").forEach((linha, index) => {
                linha.classList.toggle("sorteado", sorteados.includes(index));
            });
        }

        function imagemDoItem(item) {
            // Busca uma fotografia correspondente ao item.
            // O parâmetro aleatório evita que o navegador mantenha sempre a mesma foto.
            return "https://loremflickr.com/900/700/" +
                encodeURIComponent(item.busca) +
                "?lock=" + item.nome.length;
        }

        function sortear() {
            // Evita repetir um item enquanto ainda houver opções não sorteadas.
            let disponiveis = acompanhamentos
                .map((item, index) => index)
                .filter(index => !sorteados.includes(index));

            // Quando todos forem sorteados, começa uma nova rodada.
            if (disponiveis.length === 0) {
                sorteados = [];
                disponiveis = acompanhamentos.map((item, index) => index);
            }

            const indice = disponiveis[
                Math.floor(Math.random() * disponiveis.length)
            ];

            sorteados.push(indice);

            const item = acompanhamentos[indice];

            resultadoNome.textContent = item.nome;
            resultadoFoto.innerHTML = `
                <img
                    src="${imagemDoItem(item)}"
                    alt="Foto relacionada a ${item.nome}"
                    onerror="this.parentElement.classList.add('sem-foto'); this.remove();"
                >
            `;

            resultado.classList.add("ativo");
            atualizarMenu();
        }

        botao.addEventListener("click", sortear);

        montarMenu();
    </script>
</body>
</html>
