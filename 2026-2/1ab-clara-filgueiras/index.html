<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByoU - Your New Makeup Brand</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importando a fonte moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Barra de Navegação do Topo -->
    <header class="navbar">
        <div class="logo-container">
            <img src="logo.png" alt="ByoU" class="nav-logo">
        </div>
        <nav class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#">Produtos</a>
            <a href="#">Sobre</a>
        </nav>
    </header>

    <!-- Seção de Capa (Hero) com duas fotos de fundo, logo e botão -->
    <section class="hero-section">
        <!-- As duas fotos lado a lado no fundo -->
        <div class="hero-images-grid">
            <div class="hero-img-box">
                <img src="olho.jpg" alt="ByoU Olhos">
            </div>
            <div class="hero-img-box">
                <img src="boca.jpg" alt="ByoU Lábios">
            </div>
        </div>

        <!-- Conteúdo central: Apenas a logo grande e o botão de explorar -->
        <div class="hero-overlay-content">
            <img src="logo.png" alt="ByoU Logo" class="hero-logo-img">
            <a href="#produtos" class="explore-btn">EXPLORE</a>
        </div>
    </section>

    <!-- Seção de Produtos (Aparece ao rolar a página para baixo) -->
    <section class="products-section">
        <div class="products-header">
            <h2>Destaques ByoU</h2>
            <p>Descubra a nossa coleção exclusiva</p>
        </div>

        <div class="product-grid">
    <!-- Produto 1: Base Sculpture Fluid -->
            <div class="product-card">
                <div class="product-img-box">
                    <img src="base.jfif" alt="Sculpture Fluid Base">
                </div>
                <div class="product-info">
                    <h3>Sculpture Fluid</h3>
                    <span class="product-price">R$ 149,90</span>
                    <!-- O botão agora é um link que abre a página de detalhes -->
                    <a href="produto.html" class="buy-btn">Comprar</a>
                </div>
            </div>

          <!-- Produto 2: Liquid Blush -->
            <div class="product-card">
                <div class="product-img-box">
                    <img src="blushliq.jfif" alt="Liquid Blush">
                </div>
                <div class="product-info">
                    <h3>Liquid Blush</h3>
                    <span class="product-price">R$ 119,90</span>
                    <button class="buy-btn">Comprar</button>
                </div>
            </div>

            <!-- Produto 3: Batom Sculpture -->
            <div class="product-card">
                <div class="product-img-box">
                    <img src="batom.jfif" alt="Sculpture Lipstick">
                </div>
                <div class="product-info">
                    <h3>Sculpture Lipstick</h3>
                    <span class="product-price">R$ 95,90</span>
                    <button class="buy-btn">Comprar</button>
                </div>
            </div>
            <!-- Produto 4: Concealer Wand -->
            <div class="product-card">
                <div class="product-img-box">
                    <img src="coretivo.jfif" alt="Concealer Wand">
                </div>
                <div class="product-info">
                    <h3>Concealer Wand</h3>
                    <span class="product-price">R$ 79,90</span>
                    <button class="buy-btn">Comprar</button>
                </div>
            </div>

</body>
</html>
