<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sculpture Fluid - ByoU</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="../../navbar/navbar-universal.js" defer></script>
</head>
<body class="product-page-body">

    <!-- Barra de Navegação Simples -->
    <header class="navbar">
        <div class="logo-container">
            <a href="index.html"><img src="logo.png" alt="ByoU" class="nav-logo"></a>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#produtos">Produtos</a>
            <a href="#">Sobre</a>
        </nav>
    </header>

    <!-- Detalhes do Produto -->
    <main class="product-detail-container">
        <div class="product-detail-img">
            <img src="base.jfif" alt="Sculpture Fluid">
        </div>
        
        <div class="product-detail-info">
            <span class="product-category">Face / Base</span>
            <h1>Sculpture Fluid</h1>
            <span class="detail-price">R$ 149,90</span>
            
            <p class="product-description">
                Uma base fluida de alta performance com acabamento escultórico natural. Sua fórmula leve funde-se perfeitamente à pele, proporcionando cobertura edificável e um brilho sofisticado de longa duração.
            </p>

            <!-- Seção de Cores -->
            <div class="color-selection">
                <span class="color-title">Escolha a sua cor:</span>
                <div class="color-options">
                    <span class="color-dot" style="background-color: #f5d0b1;" title="Fair 01"></span>
                    <span class="color-dot active-color" style="background-color: #e0b089;" title="Light 02"></span>
                    <span class="color-dot" style="background-color: #c69368;" title="Medium 03"></span>
                    <span class="color-dot" style="background-color: #a3704c;" title="Deep 04"></span>
                </div>
            </div>

            <button class="add-to-cart-btn">Adicionar à Sacola</button>
        </div>
    </main>

</body>
</html>
